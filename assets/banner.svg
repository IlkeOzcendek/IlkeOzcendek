<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I am İlke Özçendek — AI and Backend Engineer</title>
  <desc id="desc">A pixel-art-inspired moonlit island and lighthouse above a dark ocean, with professional profile information.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#030712"/><stop offset="1" stop-color="#082457"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38BDF8"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#020617"/><stop offset=".7" stop-color="#075985"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <radialGradient id="moon"><stop stop-color="#FFF7CC"/><stop offset=".55" stop-color="#FDE68A"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .star{animation:twinkle 4s steps(2,end) infinite;transform-origin:center}
      .s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
      .water{animation:shift 7s ease-in-out infinite}
      .cursor{animation:blink 1.1s steps(1,end) infinite}
      @keyframes twinkle{50%{opacity:.25}}
      @keyframes shift{50%{transform:translateX(18px)}}
      @keyframes blink{50%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.star,.water,.cursor{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="510" rx="22" fill="url(#sky)"/>
  <g fill="#7DD3FC"><rect class="star" x="610" y="64" width="3" height="3"/><rect class="star s2" x="704" y="98" width="2" height="2"/><rect class="star s3" x="824" y="52" width="3" height="3"/><rect class="star" x="1042" y="90" width="2" height="2"/><rect class="star s2" x="1130" y="42" width="3" height="3"/></g>
  <circle cx="905" cy="104" r="54" fill="url(#moon)" opacity=".9"/><circle cx="895" cy="98" r="24" fill="#FFF7CC"/>
  <path d="M0 310C170 280 330 322 500 300S820 295 1200 260V510H0Z" fill="url(#sea)"/>
  <g class="water" fill="#38BDF8" opacity=".5"><rect x="665" y="304" width="142" height="4"/><rect x="700" y="317" width="110" height="3"/><rect x="620" y="332" width="165" height="3"/><rect x="742" y="345" width="96" height="3"/><rect x="575" y="363" width="180" height="3"/></g>
  <path d="M760 360L840 258L940 205L1055 229L1135 335L1080 395L930 408Z" fill="#07111F"/>
  <path d="M808 353L868 278L958 235L1047 249L1101 333L1060 355L932 373Z" fill="#113C2B"/>
  <g fill="#166534"><path d="M858 278l-17-49 20 22 8-35 7 39 24-18-19 43z"/><path d="M1030 261l-11-43 18 17 7-31 8 33 18-15-14 43z"/></g>
  <g>
    <path d="M954 133H987L997 265H943Z" fill="#E2E8F0"/><path d="M949 176H990L993 205H947Z" fill="#F59E0B"/><path d="M951 130L970 109L991 130Z" fill="#0F172A"/>
    <rect x="948" y="128" width="45" height="16" fill="#082F49"/><rect x="957" y="116" width="25" height="17" fill="#38BDF8" opacity=".65"/>
    <path d="M960 133L620 208L620 254L960 149Z" fill="#FDE68A" opacity=".09"/>
  </g>
  <g transform="translate(1000 286)">
    <rect width="132" height="84" rx="3" fill="#111827" stroke="#92400E" stroke-width="4" transform="rotate(4)"/>
    <text x="17" y="29" fill="#FDBA74" font-size="14" class="mono" transform="rotate(4)">BUILDING</text>
    <text x="17" y="50" fill="#FDBA74" font-size="14" class="mono" transform="rotate(4)">THE NEXT</text>
    <text x="17" y="71" fill="#FDBA74" font-size="14" class="mono" transform="rotate(4)">ISLAND</text>
  </g>
  <g transform="translate(55 75)">
    <text y="0" fill="#CBD5E1" font-size="28">Hi, I’m</text>
    <text y="72" fill="url(#name)" font-size="62" font-weight="700">İlke Özçendek</text>
    <text y="124" fill="#818CF8" font-size="29" font-weight="600">AI &amp; Backend Engineer</text>
    <text y="184" fill="#CFFAFE" font-size="20" class="mono">I build intelligent systems that</text>
    <text y="214" fill="#CFFAFE" font-size="20" class="mono">solve real-world problems.<tspan class="cursor">│</tspan></text>
  </g>
  <g transform="translate(56 350)" font-size="14" fill="#E2E8F0">
    <text y="0">⌖  Ankara, Türkiye</text>
    <text x="185" y="0">◈  Computer Engineering</text><text x="203" y="22" fill="#94A3B8">@ TED University</text>
    <text x="440" y="0">▦  Microsoft AI Innovators</text><text x="458" y="22" fill="#94A3B8">Incoming intern</text>
    <text x="690" y="0">☁  AWS Cloud Club</text><text x="708" y="22" fill="#94A3B8">Vice President</text>
  </g>
  <g transform="translate(55 422)">
    <rect width="160" height="48" rx="8" fill="none" stroke="#38BDF8"/><text x="20" y="31" fill="#F8FAFC" font-size="16">Let’s connect</text><text x="132" y="31" fill="#A78BFA" font-size="21">→</text>
  </g>
</svg>
