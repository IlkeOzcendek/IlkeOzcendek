<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">İlke Özçendek technology stack and GitHub signal</title>
  <desc id="desc">A dark developer dashboard showing AI, backend, data, cloud, and engineering tools, plus links to İlke's GitHub work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050914"/><stop offset="1" stop-color="#0B1830"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1"><stop stop-color="#22D3EE"/><stop offset=".55" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F97316"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .tile{fill:#0C1528;stroke:#23324B;stroke-width:1}
      .label{fill:#E2E8F0;font-size:13px;font-weight:600}
      .muted{fill:#94A3B8}
    </style>
  </defs>
  <rect width="1200" height="390" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="388" rx="19" fill="none" stroke="#26364F"/>
  <rect x="42" y="34" width="32" height="32" rx="9" fill="#111C2E"/><path d="M50 45l13 5-13 5M65 57h6" fill="none" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="88" y="58" fill="#F8FAFC" font-size="25" font-weight="700">TECH STACK</text>
  <text x="42" y="92" class="mono muted" font-size="12">tools I use to turn models into usable systems</text>
  <path d="M42 111H740" stroke="url(#line)" stroke-width="2" opacity=".75"/>

  <g transform="translate(42 132)">
    <text y="0" fill="#67E8F9" font-size="13" font-weight="700">AI &amp; MACHINE LEARNING</text>
    <g transform="translate(0 18)">
      <rect class="tile" width="155" height="70" rx="12"/><g transform="translate(16 15)"><path d="M3 18c0-9 5-15 16-15h10v13H16v5H3z" fill="#3776AB"/><circle cx="23" cy="8" r="2" fill="#F8FAFC"/><path d="M37 22c0 9-5 15-16 15H11V24h13v-5h13z" fill="#FFD343"/><circle cx="17" cy="32" r="2" fill="#172554"/></g><text x="64" y="43" class="label">Python</text>
    </g>
    <g transform="translate(166 18)">
      <rect class="tile" width="155" height="70" rx="12"/><circle cx="34" cy="35" r="16" fill="none" stroke="#EE4C2C" stroke-width="4"/><path d="M34 12l6 8M46 16l5-6" stroke="#EE4C2C" stroke-width="4" stroke-linecap="round"/><text x="62" y="43" class="label">PyTorch</text>
    </g>
    <g transform="translate(332 18)">
      <rect class="tile" width="155" height="70" rx="12"/><g transform="translate(33 34)"><circle cx="0" cy="-10" r="11" fill="none" stroke="#EF4444" stroke-width="5"/><circle cx="-10" cy="8" r="11" fill="none" stroke="#22C55E" stroke-width="5"/><circle cx="10" cy="8" r="11" fill="none" stroke="#3B82F6" stroke-width="5"/></g><text x="63" y="43" class="label">OpenCV</text>
    </g>
    <g transform="translate(498 18)">
      <rect class="tile" width="200" height="70" rx="12"/><g transform="translate(30 35)" fill="none" stroke="#A78BFA" stroke-width="2"><circle cx="-13" cy="0" r="5"/><circle cx="0" cy="-13" r="5"/><circle cx="13" cy="0" r="5"/><circle cx="0" cy="13" r="5"/><path d="M-9-3L-3-9M3-9L9-3M9 3L3 9M-3 9L-9 3"/></g><text x="60" y="43" class="label">scikit-learn</text>
    </g>
  </g>

  <g transform="translate(42 254)">
    <text y="0" fill="#A78BFA" font-size="13" font-weight="700">BACKEND · DATA · CLOUD</text>
    <g transform="translate(0 18)">
      <rect class="tile" width="122" height="70" rx="12"/><circle cx="32" cy="35" r="18" fill="#009688"/><path d="M36 17L24 36h10l-6 17 16-23H34z" fill="#F8FAFC"/><text x="58" y="43" class="label">FastAPI</text>
    </g>
    <g transform="translate(133 18)">
      <rect class="tile" width="145" height="70" rx="12"/><path d="M20 25c0-8 27-8 27 0v22c0 8-27 8-27 0zM20 25c0 8 27 8 27 0M20 36c0 8 27 8 27 0" fill="none" stroke="#60A5FA" stroke-width="2"/><text x="58" y="43" class="label">PostgreSQL</text>
    </g>
    <g transform="translate(289 18)">
      <rect class="tile" width="120" height="70" rx="12"/><g transform="translate(20 25)" fill="#2496ED"><rect width="10" height="9"/><rect x="12" width="10" height="9"/><rect x="24" width="10" height="9"/><rect x="12" y="-11" width="10" height="9"/><path d="M-3 12h42c-2 14-12 20-27 20C1 32-3 24-3 12z"/></g><text x="62" y="43" class="label">Docker</text>
    </g>
    <g transform="translate(420 18)">
      <rect class="tile" width="100" height="70" rx="12"/><text x="17" y="39" fill="#F8FAFC" font-size="20" font-weight="700">aws</text><path d="M17 47c20 10 43 7 60-4" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/><text x="61" y="43" class="label">AWS</text>
    </g>
    <g transform="translate(531 18)">
      <rect class="tile" width="90" height="70" rx="12"/><circle cx="28" cy="35" r="19" fill="#F8FAFC"/><path d="M28 19l-7 12 7 16 7-16z" fill="#111827"/><text x="55" y="43" class="label">Linux</text>
    </g>
    <g transform="translate(632 18)">
      <rect class="tile" width="66" height="70" rx="12"/><path d="M24 23v24M24 29l13 8M24 41l-10-6" fill="none" stroke="#F97316" stroke-width="3"/><circle cx="24" cy="22" r="4" fill="#F97316"/><circle cx="38" cy="38" r="4" fill="#F97316"/><circle cx="13" cy="34" r="4" fill="#F97316"/>
    </g>
  </g>

  <path d="M780 34V356" stroke="#26364F"/>
  <g transform="translate(820 38)">
    <rect width="34" height="34" rx="10" fill="#111C2E"/><path d="M17 8l10 9-10 9-10-9z" fill="none" stroke="#A78BFA" stroke-width="2"/><circle cx="17" cy="17" r="4" fill="#67E8F9" filter="url(#glow)"/>
    <text x="50" y="26" fill="#F8FAFC" font-size="25" font-weight="700">GITHUB SIGNAL</text>
    <text y="72" class="mono muted" font-size="12">live paths into what I’m building</text>
    <g transform="translate(0 100)">
      <rect width="330" height="66" rx="12" fill="#0C1528" stroke="#1E7490"/><circle cx="35" cy="33" r="18" fill="#4C2BC5"/><path d="M24 42c3-12 19-21 23-14 3 6-12 7-16 10-5 4 4 6 12 0l5-4 4 3" fill="none" stroke="#F8FAFC" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="28" fill="#F8FAFC" font-size="16" font-weight="700">Signify</text><text x="68" y="49" class="mono muted" font-size="11">signature verification →</text>
    </g>
    <g transform="translate(0 178)">
      <rect width="330" height="66" rx="12" fill="#0C1528" stroke="#5B4BB7"/><circle cx="35" cy="33" r="18" fill="#164E63"/><path d="M24 26h10l4 4h9v14H24zM28 35h15M28 40h10" fill="none" stroke="#67E8F9" stroke-width="2.2" stroke-linejoin="round"/><text x="68" y="28" fill="#F8FAFC" font-size="16" font-weight="700">Repositories</text><text x="68" y="49" class="mono muted" font-size="11">explore public work →</text>
    </g>
    <g transform="translate(0 256)">
      <rect width="330" height="66" rx="12" fill="#0C1528" stroke="#A65318"/><circle cx="35" cy="33" r="18" fill="#7C2D12" opacity=".5"/><path d="M24 39l8-9 7 5 8-12" fill="none" stroke="#FDBA74" stroke-width="3"/><text x="68" y="28" fill="#F8FAFC" font-size="16" font-weight="700">Contributions</text><text x="68" y="49" class="mono muted" font-size="11">follow the build trail →</text>
    </g>
  </g>
</svg>
