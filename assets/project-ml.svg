  <text x="172" y="48" fill="#FDBA74" font-family="ui-monospace,monospace" font-size="13" font-weight="700">IN DEVELOPMENT · DATA STRUCTURES</text><text x="172" y="83" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="750">LLRB Tree Visualisation</text><text x="172" y="112" fill="#CBD5E1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">An interactive way to explore rotations, color flips and balanced-tree operations</text>
