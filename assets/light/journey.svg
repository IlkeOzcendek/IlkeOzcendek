<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">İlke Özçendek — Journey</title>
  <desc id="desc">İlke's journey: Computer Engineering and a Control Systems minor at TED University, a software development internship at Forte, the TÜRKTRUST AI internship where Signify began, the ongoing FlyRank AI Internship Program, Waggle developed through Microsoft AI Innovators Summer Program 2026, the AWS Student Builder Group at TED University, and ongoing KESKİN capstone research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFC" />
      <stop offset="1" stop-color="#F4F7FB" />
    </linearGradient>
    <linearGradient id="route" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087E98" />
      <stop offset=".52" stop-color="#7152B8" />
      <stop offset="1" stop-color="#B85B2A" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.15px}
      .name{fill:#162A46;font-size:17px;font-weight:700}
      .detail{fill:#52647B;font-size:13px}
      .routeGlow{animation:breathe 5.5s ease-in-out infinite}
      .traveler{animation:travel 13s ease-in-out infinite}
      .node{animation:nodePulse 4s ease-in-out infinite}
      .n2{animation-delay:.55s}.n3{animation-delay:1.1s}.n4{animation-delay:1.65s}.n5{animation-delay:2.2s}.n6{animation-delay:2.75s}.n7{animation-delay:3.3s}
      @keyframes breathe{50%{opacity:.48}}
      @keyframes travel{0%,7%{transform:translateX(0);opacity:0}12%{opacity:.85}88%{opacity:.85}93%,100%{transform:translateX(1060px);opacity:0}}
      @keyframes nodePulse{50%{opacity:.6}}
      @media(prefers-reduced-motion:reduce){.routeGlow,.traveler,.node{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="520" rx="22" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#D9E3EE" stroke-width="2" />

  <g transform="translate(44 32)">
    <rect width="44" height="44" rx="12" fill="#E5EDF6" />
    <path d="M12 14h20M12 22h14M12 30h9" fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round" />
    <circle cx="33" cy="30" r="3.5" fill="#B85B2A" />
    <text x="62" y="29" fill="#162A46" font-size="28" font-weight="750">MY JOURNEY</text>
    <text x="62" y="54" class="mono detail">a path shaped by learning, building and community</text>
  </g>
  <path d="M44 104H1156" stroke="#D9E3EE" />

  <g transform="translate(0 236)">
    <path d="M70 76C245 18 353 134 530 76S815 18 1130 76" fill="none" stroke="url(#route)" stroke-width="15" opacity=".12" filter="url(#glow)" class="routeGlow" />
    <path d="M70 76C245 18 353 134 530 76S815 18 1130 76" fill="none" stroke="#D9E3EE" stroke-width="3" stroke-linecap="round" />
    <path d="M70 76C245 18 353 134 530 76S815 18 1130 76" fill="none" stroke="url(#route)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 9" opacity=".82" />
    <g class="traveler">
      <circle cx="70" cy="76" r="13" fill="#087E98" opacity=".16" filter="url(#glow)" />
      <circle cx="70" cy="76" r="4" fill="#087E98" />
    </g>

    <g transform="translate(70 76)">
      <circle class="node" r="10" fill="#F8FAFC" stroke="#087E98" stroke-width="3" />
      <path d="M0 13V31" stroke="#087E98" opacity=".7" />
      <g transform="translate(-55 39)">
        <rect width="190" height="98" rx="15" fill="#FFFFFF" stroke="#D9E3EE" />
        <text x="16" y="24" class="mono eyebrow" fill="#087E98">FOUNDATION</text>
        <text x="16" y="50" class="name">TED University</text>
        <text x="16" y="72" class="detail">Computer Engineering</text>
        <text x="16" y="90" class="detail">Control Systems minor</text>
      </g>
    </g>

    <g transform="translate(245 65.68)">
      <circle class="node n2" r="10" fill="#F8FAFC" stroke="#3569AD" stroke-width="3" />
      <path d="M0 -13V-31" stroke="#3569AD" opacity=".7" />
      <g transform="translate(-97 -130)">
        <rect width="194" height="98" rx="15" fill="#FFFFFF" stroke="#D9E3EE" />
        <text x="16" y="24" class="mono eyebrow" fill="#3569AD">SOFTWARE</text>
        <text x="16" y="50" class="name">Forte</text>
        <text x="16" y="72" class="detail">Software Development</text>
        <text x="16" y="90" class="detail">Internship</text>
      </g>
    </g>

    <g transform="translate(420 92.70)">
      <circle class="node n3" r="10" fill="#F8FAFC" stroke="#7152B8" stroke-width="3" />
      <path d="M0 13V31" stroke="#7152B8" opacity=".7" />
      <g transform="translate(-105 39)">
        <rect width="210" height="98" rx="15" fill="#FFFFFF" stroke="#D9E3EE" />
        <text x="16" y="24" class="mono eyebrow" fill="#7152B8">SIGNIFY ORIGIN</text>
        <text x="16" y="50" class="name">TÜRKTRUST</text>
        <text x="16" y="72" class="detail">AI internship</text>
        <text x="16" y="90" class="detail">Signature verification</text>
      </g>
    </g>

    <g transform="translate(595 56.62)">
      <circle class="node n4" r="10" fill="#F8FAFC" stroke="#7152B8" stroke-width="3" />
      <path d="M0 -13V-31" stroke="#7152B8" opacity=".7" />
      <g transform="translate(-110 -130)">
        <rect width="220" height="98" rx="15" fill="#FFFFFF" stroke="#D9E3EE" />
        <text x="16" y="24" class="mono eyebrow" fill="#7152B8">ENGINEERING · ONGOING</text>
        <text x="16" y="50" class="name">FlyRank</text>
        <text x="16" y="72" class="detail">AI Internship Program</text>
        <text x="16" y="90" class="detail">Backend AI Engineering</text>
      </g>
    </g>

    <g transform="translate(770 32.54)">
      <circle class="node n5" r="10" fill="#F8FAFC" stroke="#7152B8" stroke-width="3" />
      <path d="M0 13V31" stroke="#7152B8" opacity=".7" />
      <g transform="translate(-125 39)">
        <rect width="250" height="98" rx="15" fill="#FFFFFF" stroke="#D9E3EE" />
        <text x="16" y="24" class="mono eyebrow" fill="#7152B8">AI INNOVATION · 2026</text>
        <text x="16" y="50" class="name">Microsoft AI Innovators</text>
        <text x="16" y="72" class="detail">Co-developed Waggle</text>
        <text x="16" y="90" class="detail">Summer Program 2026</text>
      </g>
    </g>

    <g transform="translate(945 45.57)">
      <circle class="node n6" r="10" fill="#F8FAFC" stroke="#A66A13" stroke-width="3" />
      <path d="M0 -13V-31" stroke="#A66A13" opacity=".7" />
      <g transform="translate(-132 -164)">
        <rect width="264" height="132" rx="15" fill="#FFFFFF" stroke="#D9E3EE" />
        <text x="16" y="24" class="mono eyebrow" fill="#A66A13">COMMUNITY</text>
        <text x="16" y="53" class="name">AWS Student Builder Group</text>
        <text x="16" y="81" class="detail">TED University</text>
        <text x="16" y="106" class="detail">Founding Vice President</text>
      </g>
    </g>

    <g transform="translate(1120 74.17)">
      <circle class="node n7" r="10" fill="#F8FAFC" stroke="#B85B2A" stroke-width="3" />
      <path d="M0 13V31" stroke="#B85B2A" opacity=".7" />
      <g transform="translate(-110 39)">
        <rect width="178" height="98" rx="15" fill="#FFFFFF" stroke="#D9E3EE" />
        <text x="16" y="24" class="mono eyebrow" fill="#B85B2A">CAPSTONE RESEARCH</text>
        <text x="16" y="50" class="name">KESKİN</text>
        <text x="16" y="72" class="detail">SAR super-resolution</text>
        <text x="16" y="90" class="detail">Thesis in progress</text>
      </g>
    </g>
  </g>
</svg>