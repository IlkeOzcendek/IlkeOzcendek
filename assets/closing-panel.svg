<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" role="img" aria-labelledby="t d">
  <title id="t">Build things people can actually use</title>
  <desc id="d">Keep learning. Keep shipping. Let's connect and build thoughtful, reliable systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050914"/><stop offset="1" stop-color="#0B1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#22D3EE"/><stop offset=".52" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .mist{animation:drift 9s ease-in-out infinite alternate}
      @keyframes drift{to{transform:translateX(90px);opacity:.46}}
      @media(prefers-reduced-motion:reduce){.mist{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="190" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="188" rx="21" fill="none" stroke="#26364F" stroke-width="2"/>
  <ellipse class="mist" cx="555" cy="95" rx="180" ry="42" fill="#8B5CF6" opacity=".12" filter="url(#blur)"/>
  <rect x="47" y="39" width="4" height="112" rx="2" fill="url(#accent)"/>
  <text x="78" y="76" fill="#F8FAFC" font-size="27" font-weight="700">“Build things people can actually use.”</text>
  <text x="78" y="115" fill="#94A3B8" font-size="18">Keep learning. Keep shipping.</text>
  <path d="M604 34V156" stroke="#26364F"/>
  <text x="650" y="66" fill="#A5B4FC" class="mono" font-size="12" font-weight="700" letter-spacing="1.4">LET’S CONNECT</text>
  <text x="650" y="99" fill="#F8FAFC" font-size="23" font-weight="700">Ideas are better when they become real.</text>
  <text x="650" y="130" fill="#94A3B8" font-size="16">AI · backend engineering · cloud · developer communities</text>
</svg>
