<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">İlke Özçendek — Current Mission</title>
  <desc id="desc">İlke's current work across Microsoft AI Innovators, Signify, FlyRank, AWS Cloud Club, and reliable AI systems.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050914"/>
      <stop offset="1" stop-color="#0B1830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .muted{fill:#94A3B8}
      .label{fill:#94A3B8;font-size:13px;letter-spacing:1.4px}
      .copy{fill:#E2E8F0;font-size:18px}
      .strong{fill:#F8FAFC;font-weight:700}
      .scan{opacity:0;animation:scan 15s ease-in-out infinite}
      .s2{animation-delay:3s}.s3{animation-delay:6s}.s4{animation-delay:9s}.s5{animation-delay:12s}
      .status{animation:pulse 3.4s ease-in-out infinite}
      @keyframes scan{0%,14%,100%{opacity:0;transform:scaleX(.22)}5%,9%{opacity:.62;transform:scaleX(1)}}
      @keyframes pulse{50%{opacity:.35}}
      @media(prefers-reduced-motion:reduce){.scan,.status{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="500" rx="22" fill="url(#panelBg)"/>
  <rect x="1" y="1" width="1198" height="498" rx="21" fill="none" stroke="#26364F" stroke-width="2"/>

  <g transform="translate(44 34)">
    <rect width="42" height="42" rx="11" fill="#111C2E"/>
    <g transform="translate(11 11)" fill="#67E8F9">
      <rect x="0" y="11" width="5" height="9" rx="2"/>
      <rect x="8" y="0" width="5" height="20" rx="2"/>
      <rect x="16" y="6" width="5" height="14" rx="2"/>
    </g>
    <text x="60" y="29" fill="#F8FAFC" font-size="28" font-weight="700">CURRENT MISSION</text>
    <text x="60" y="54" class="mono muted" font-size="12">what I’m building, learning and contributing to</text>

    <g transform="translate(926 10)">
      <circle class="status" cx="8" cy="8" r="5" fill="#22D3EE"/>
      <text x="24" y="13" class="mono muted" font-size="12" letter-spacing="1">IN PROGRESS</text>
    </g>
  </g>

  <path d="M44 104H1156" stroke="#26364F"/>

  <g transform="translate(44 118)">
    <g>
      <text x="18" y="40" class="mono muted" font-size="14">01</text>
      <path d="M58 5V63" stroke="#22D3EE" stroke-width="2" opacity=".65"/>
      <text x="82" y="25" class="mono label">MICROSOFT AI INNOVATORS · INTERNSHIP PROGRAM</text>
      <text x="82" y="50" class="copy">Developing a new AI project through <tspan class="strong">Microsoft’s AI Innovators Internship Program</tspan></text>
      <path d="M82 66H1112" stroke="#26364F"/>
      <rect class="scan" x="82" y="65" width="1030" height="1" fill="url(#accent)" transform-origin="center"/>
    </g>

    <g transform="translate(0 72)">
      <text x="18" y="40" class="mono muted" font-size="14">02</text>
      <path d="M58 5V63" stroke="#8B5CF6" stroke-width="2" opacity=".65"/>
      <text x="82" y="25" class="mono label">SIGNIFY · CONTINUING PROJECT</text>
      <text x="82" y="50" class="copy">Continuing to develop <tspan class="strong">Signify</tspan>, a signature verification project originally created during my internship at TÜRKTRUST</text>
      <path d="M82 66H1112" stroke="#26364F"/>
      <rect class="scan s2" x="82" y="65" width="1030" height="1" fill="url(#accent)" transform-origin="center"/>
    </g>

    <g transform="translate(0 144)">
      <text x="18" y="40" class="mono muted" font-size="14">03</text>
      <path d="M58 5V63" stroke="#60A5FA" stroke-width="2" opacity=".65"/>
      <text x="82" y="25" class="mono label">ENGINEERING</text>
      <text x="82" y="50" class="copy">Working as a <tspan class="strong">Backend AI Engineering Intern at FlyRank</tspan></text>
      <path d="M82 66H1112" stroke="#26364F"/>
      <rect class="scan s3" x="82" y="65" width="1030" height="1" fill="url(#accent)" transform-origin="center"/>
    </g>

    <g transform="translate(0 216)">
      <text x="18" y="40" class="mono muted" font-size="14">04</text>
      <path d="M58 5V63" stroke="#F59E0B" stroke-width="2" opacity=".65"/>
      <text x="82" y="25" class="mono label">COMMUNITY</text>
      <text x="82" y="50" class="copy">Supporting the <tspan class="strong">AWS Cloud Club at TED University</tspan> as Vice President</text>
      <path d="M82 66H1112" stroke="#26364F"/>
      <rect class="scan s4" x="82" y="65" width="1030" height="1" fill="url(#accent)" transform-origin="center"/>
    </g>

    <g transform="translate(0 288)">
      <text x="18" y="40" class="mono muted" font-size="14">05</text>
      <path d="M58 5V63" stroke="#F97316" stroke-width="2" opacity=".65"/>
      <text x="82" y="25" class="mono label">LEARNING</text>
      <text x="82" y="50" class="copy">Learning to ship AI systems with reliable backend and cloud infrastructure</text>
      <rect class="scan s5" x="82" y="65" width="1030" height="1" fill="url(#accent)" transform-origin="center"/>
    </g>
  </g>
</svg>
