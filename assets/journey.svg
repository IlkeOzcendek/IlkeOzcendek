<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">İlke Özçendek — Journey</title>
  <desc id="desc">İlke's journey from Computer Engineering at TED University through TÜRKTRUST, FlyRank, Microsoft AI Innovators, AWS Cloud Club and the continued development of Signify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050914"/>
      <stop offset="1" stop-color="#0B1830"/>
    </linearGradient>
    <linearGradient id="route" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".52" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.15px}
      .name{fill:#F8FAFC;font-size:17px;font-weight:700}
      .detail{fill:#94A3B8;font-size:13px}
      .routeGlow{animation:breathe 5.5s ease-in-out infinite}
      .traveler{animation:travel 13s ease-in-out infinite}
      .node{animation:nodePulse 4s ease-in-out infinite}
      .n2{animation-delay:.55s}.n3{animation-delay:1.1s}.n4{animation-delay:1.65s}.n5{animation-delay:2.2s}.n6{animation-delay:2.75s}
      @keyframes breathe{50%{opacity:.48}}
      @keyframes travel{0%,7%{transform:translateX(0);opacity:0}12%{opacity:.85}88%{opacity:.85}93%,100%{transform:translateX(1060px);opacity:0}}
      @keyframes nodePulse{50%{opacity:.6}}
      @media(prefers-reduced-motion:reduce){.routeGlow,.traveler,.node{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="480" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="478" rx="21" fill="none" stroke="#26364F" stroke-width="2"/>

  <g transform="translate(44 32)">
    <rect width="44" height="44" rx="12" fill="#111C2E"/>
    <path d="M12 14h20M12 22h14M12 30h9" fill="none" stroke="url(#route)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="33" cy="30" r="3.5" fill="#F97316"/>
    <text x="62" y="29" fill="#F8FAFC" font-size="28" font-weight="750">MY JOURNEY</text>
    <text x="62" y="54" class="mono detail">a path shaped by learning, building and community</text>
  </g>
  <path d="M44 104H1156" stroke="#26364F"/>

  <g transform="translate(0 198)">
    <path d="M70 76C245 18 353 134 530 76S815 18 1130 76" fill="none" stroke="url(#route)" stroke-width="15" opacity=".12" filter="url(#glow)" class="routeGlow"/>
    <path d="M70 76C245 18 353 134 530 76S815 18 1130 76" fill="none" stroke="#26364F" stroke-width="3" stroke-linecap="round"/>
    <path d="M70 76C245 18 353 134 530 76S815 18 1130 76" fill="none" stroke="url(#route)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 9" opacity=".82"/>
    <g class="traveler">
      <circle cx="70" cy="76" r="13" fill="#38BDF8" opacity=".16" filter="url(#glow)"/>
      <circle cx="70" cy="76" r="4" fill="#E0F2FE"/>
    </g>

    <g transform="translate(70 76)">
      <circle class="node" r="10" fill="#07111F" stroke="#38BDF8" stroke-width="3"/>
      <path d="M0 13V31" stroke="#38BDF8" opacity=".7"/>
      <g transform="translate(-55 39)">
        <rect width="174" height="98" rx="15" fill="#0A1426" stroke="#203451"/>
        <text x="16" y="24" class="mono eyebrow" fill="#67E8F9">FOUNDATION</text>
        <text x="16" y="50" class="name">TED University</text>
        <text x="16" y="72" class="detail">Computer Engineering</text>
        <text x="16" y="90" class="detail">Control Systems minor</text>
      </g>
    </g>

    <g transform="translate(286 63)">
      <circle class="node n2" r="10" fill="#07111F" stroke="#60A5FA" stroke-width="3"/>
      <path d="M0 -13V-31" stroke="#60A5FA" opacity=".7"/>
      <g transform="translate(-83 -126)">
        <rect width="188" height="94" rx="15" fill="#0A1426" stroke="#203451"/>
        <text x="16" y="24" class="mono eyebrow" fill="#93C5FD">ORIGIN STORY</text>
        <text x="16" y="50" class="name">TÜRKTRUST</text>
        <text x="16" y="72" class="detail">Internship · Signify origin</text>
      </g>
    </g>

    <g transform="translate(492 86)">
      <circle class="node n3" r="10" fill="#07111F" stroke="#818CF8" stroke-width="3"/>
      <path d="M0 13V31" stroke="#818CF8" opacity=".7"/>
      <g transform="translate(-78 39)">
        <rect width="190" height="80" rx="15" fill="#0A1426" stroke="#283052"/>
        <text x="16" y="24" class="mono eyebrow" fill="#A5B4FC">ENGINEERING</text>
        <text x="16" y="50" class="name">FlyRank</text>
        <text x="16" y="70" class="detail">Backend AI Engineering Intern</text>
      </g>
    </g>

    <g transform="translate(704 59)">
      <circle class="node n4" r="10" fill="#07111F" stroke="#A78BFA" stroke-width="3"/>
      <path d="M0 -13V-31" stroke="#A78BFA" opacity=".7"/>
      <g transform="translate(-101 -126)">
        <rect width="234" height="94" rx="15" fill="#0A1426" stroke="#342B59"/>
        <text x="16" y="24" class="mono eyebrow" fill="#C4B5FD">NOW · AI INNOVATION</text>
        <text x="16" y="50" class="name">Microsoft AI Innovators</text>
        <text x="16" y="72" class="detail">Internship Program</text>
      </g>
    </g>

    <g transform="translate(918 71)">
      <circle class="node n5" r="10" fill="#07111F" stroke="#F59E0B" stroke-width="3"/>
      <path d="M0 13V31" stroke="#F59E0B" opacity=".7"/>
      <g transform="translate(-100 39)">
        <rect width="205" height="80" rx="15" fill="#0A1426" stroke="#443329"/>
        <text x="16" y="24" class="mono eyebrow" fill="#FBBF24">COMMUNITY</text>
        <text x="16" y="50" class="name">AWS Cloud Club</text>
        <text x="16" y="70" class="detail">Vice President</text>
      </g>
    </g>

    <g transform="translate(1130 76)">
      <circle class="node n6" r="10" fill="#07111F" stroke="#F97316" stroke-width="3"/>
      <path d="M0 -13V-31" stroke="#F97316" opacity=".7"/>
      <g transform="translate(-183 -126)">
        <rect width="183" height="94" rx="15" fill="#0A1426" stroke="#513026"/>
        <text x="16" y="24" class="mono eyebrow" fill="#FDBA74">STILL BUILDING</text>
        <text x="16" y="50" class="name">Signify</text>
        <text x="16" y="72" class="detail">Continuing development</text>
      </g>
    </g>
  </g>
</svg>
